# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: "Xingyu's Tech Space"
subtitle: 'Stay hungry, stay foolish'
description: '刘星宇的技术博客，专注具身智能 (Embodied AI)、机器人学、深度学习与算法、离散数学等领域的学习思考与工程实践。'
keywords: '刘星宇,具身智能,Embodied AI,机器人,深度学习,算法与数据结构,离散数学,图论,Tech Blog'
author: Xingyu Liu
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## GitHub Pages 部署路径配置：
url: https://xingyuliu456.github.io
root: /
permalink: posts/:hash/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting (首页展示全部分类专栏导航，无需分页)
index_generator:
  path: ''
  per_page: 0
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Markdown-it 渲染引擎（兼容 VSCode 风格的行内/块级 LaTeX 公式与 GFM 语法）
markdown:
  preset: 'default'
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: false
  anchors:
    level: 2
    collisionSuffix: ''
    permalink: false
  plugins:
    - markdown-it-sub
    - markdown-it-sup
    - markdown-it-ins
    - markdown-it-mark
    - markdown-it-footnote
    - markdown-it-task-lists
    - markdown-it-emoji
    - markdown-it-abbr
    - markdown-it-deflist
    - markdown-it-container
    # LaTeX 数学公式渲染
    - name: '@renbaoshuo/markdown-it-katex'
      options:
        throwOnError: false
        strict: false
        output: 'html'

# Local Search (hexo-generator-searchdb)
search:
  path: search.xml
  field: post
  content: true
  format: html

# Sitemap (hexo-generator-sitemap)
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/xingyuliu456/xingyuliu456.github.io.git
  branch: gh-pages
