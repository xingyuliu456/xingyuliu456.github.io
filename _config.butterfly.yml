# Butterfly Theme Configuration
# Docs: https://butterfly.js.org/

# 网站图标 (Favicon)
favicon: /img/site_icon.png

# 导航栏设置 (简约大气，支持毛玻璃磨砂效果)
nav:
  logo: false
  display_title: true
  fixed: true

# 菜单配置
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-user

# 社交链接
social:
  fab fa-github: https://github.com/xingyuliu456 || GitHub
  fas fa-envelope: mailto:xingyuliu123@qq.com || 邮箱

# 网站头像与作者卡片 (你的微信头像)
avatar:
  img: /img/avatar.jpg
  effect: false

# 顶图 Banner (远山星空与动态流星雨，契合“星宇”之名)
index_img: https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2560&q=85
archive_img: https://images.unsplash.com/photo-1538370965046-79c0d6907d47?auto=format&fit=crop&w=2560&q=85
tag_img: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2560&q=85
category_img: https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=2560&q=85
default_top_img: https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=2560&q=85

# 全局背景：采用与顶部同款远山星空壁纸（经 CSS 高斯模糊处理作为整站背景，浑然一体）
background: https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2560&q=85

# 暗色模式 (Dark Mode)
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# 阅读进度条
reading_progress:
  enable: true
  color: "#49b1f5"
  height: "3px"

# 代码块配置 (简约现代风格，开启一键复制)
code_blocks:
  copy: true
  style: mac
  shrink: false
  fullpage: false

# 字体与排版
font:
  global-font-size: 16px
  code-font-size: 14px

# 页面打字机副标题效果
subtitle:
  enable: true
  loop: true
  source: false
  sub:
    - "Stay hungry, stay foolish."
    - "Code, think, explore and create."

# 页脚配置
footer:
  owner:
    enable: true
    since: 2026
  custom_text: '<span>Driven by Curiosity & Passion</span>'

# 侧边栏卡片优化
aside:
  card_author:
    enable: true
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/xingyuliu456
  card_announcement:
    enable: false
  card_recent_post:
    enable: false

# 数学公式渲染 (配合 hexo-renderer-markdown-it + KaTeX，支持行内 $...$ 与块级 $$...$$)
math:
  use: katex
  per_page: false
  hide_scrollbar: false
  katex:
    copy_tex: true

# Mermaid 流程图渲染 (支持标准 ```mermaid 代码块)
mermaid:
  enable: true
  code_write: true
  theme:
    light: default
    dark: dark
  open_in_new_tab: true
  zoom_pan: true

# 自定义样式与脚本注入 (消除页脚突兀蓝色，注入流星雨动态特效与全局 KaTeX CSS)
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/meteor.js"></script>
